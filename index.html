<script>
const MAP=`<svg viewBox="0 0 300 200" role="img" aria-label="Denah sekolah"><text x="150" y="14" text-anchor="middle" font-size="13">⬆ U (Utara)</text><rect x="110" y="25" width="80" height="35" fill="#ffd23f"/><text x="150" y="47" text-anchor="middle" font-size="12">Ruang Kelas</text><rect x="100" y="80" width="100" height="50" fill="#74c69d"/><text x="150" y="110" text-anchor="middle" font-size="12">Lapangan</text><rect x="10" y="85" width="75" height="40" fill="#a2d2ff"/><text x="47" y="109" text-anchor="middle" font-size="12">Perpustakaan</text><rect x="215" y="85" width="75" height="40" fill="#ffafcc"/><text x="252" y="109" text-anchor="middle" font-size="12">Kantin</text><rect x="120" y="155" width="60" height="30" fill="#ef476f"/><text x="150" y="175" text-anchor="middle" font-size="12" fill="#fff">Gerbang</text><path d="M150 155V130M150 80V60" stroke="#555" stroke-width="3" stroke-dasharray="5"/></svg>`;
const Q1=[
{c:"Narasi · L1",t:"Pada hari Minggu, Rani pergi ke rumah nenek di desa. Ia membawa kue bolu buatan Ibu sebagai oleh-oleh. Nenek sangat senang dan memeluk Rani erat.",q:"Apa yang dibawa Rani untuk Nenek?",o:["Buah mangga","Kue bolu","Boneka","Buku cerita"],a:1,e:"Jawabannya ada di teks: Rani membawa kue bolu buatan Ibu. Soal ini bertanya informasi yang tertulis jelas (tersurat)."},
{c:"Narasi · L2 Watak",t:"Dika menemukan dompet di lapangan. Walaupun isinya banyak uang, ia tidak mengambilnya. Dika segera menyerahkan dompet itu kepada Pak Guru.",q:"Sifat Dika yang tepat adalah ...",o:["Pelit","Jujur","Penakut","Malas"],a:1,e:"Dika tidak mengambil uang yang bukan miliknya dan mengembalikannya. Itu tanda anak yang jujur."},
{c:"Narasi · L2 Idiom",t:"Andi menjuarai lomba menggambar, tetapi ia tidak pernah menyombongkan diri. Ia tetap ramah kepada semua teman.",q:"Sifat Andi disebut ... (ungkapan yang tepat)",o:["Besar kepala","Rendah hati","Keras kepala","Panjang tangan"],a:1,e:"Rendah hati artinya tidak sombong walaupun berprestasi. Besar kepala justru artinya sombong."},
{c:"Narasi · L2 Idiom",t:"Saat adiknya menangis karena mainannya patah, Kak Sinta tidak marah. Ia berpikir dengan kepala dingin, lalu membantu memperbaikinya.",q:"Arti kepala dingin pada teks adalah ...",o:["Sedang demam","Tenang dan tidak emosi","Memakai topi","Sangat takut"],a:1,e:"Kepala dingin artinya tetap tenang dan sabar saat menghadapi masalah."},
{c:"Narasi · L2 Amanat",t:"Semut rajin mengumpulkan makanan setiap hari. Belalang hanya bermain dan bernyanyi. Saat musim hujan tiba, belalang kelaparan dan meminta bantuan semut.",q:"Amanat cerita tersebut adalah ...",o:["Bermain itu salah","Rajinlah bekerja agar siap di masa depan","Semut lebih pintar dari belalang","Hujan itu menakutkan"],a:1,e:"Belalang menyesal karena malas. Pesannya: rajin bekerja dan mempersiapkan diri."},
{c:"Narasi · L3 Kesesuaian",t:"Budi dan Tono berangkat ke kebun binatang naik sepeda. Di sana mereka melihat gajah dan jerapah. Sebelum pulang, Budi membeli es krim.",q:"Pernyataan yang SESUAI dengan cerita adalah ...",o:["Budi dan Tono naik bus","Mereka melihat singa","Budi membeli es krim","Tono membeli topi"],a:2,e:"Hanya pilihan C yang cocok dengan cerita. Cek tiap pilihan dengan teks, ya!"},
{c:"Informatif · L1",t:"Kupu-kupu mengalami empat tahap kehidupan: telur, ulat, kepompong, lalu kupu-kupu dewasa. Ulat banyak makan daun agar tumbuh besar.",q:"Tahap setelah ulat adalah ...",o:["Telur","Kepompong","Kupu-kupu dewasa","Daun"],a:1,e:"Urutannya: telur → ulat → kepompong → kupu-kupu."},
{c:"Informatif · L2 Ide Pokok",t:"Sampah plastik sulit terurai. Plastik yang dibuang ke laut dapat termakan penyu dan ikan. Karena itu, kita perlu mengurangi pemakaian plastik.",q:"Ide pokok teks tersebut adalah ...",o:["Penyu suka makan ikan","Laut itu luas","Sampah plastik berbahaya sehingga harus dikurangi","Plastik berwarna-warni"],a:2,e:"Ide pokok adalah gagasan utama yang dibahas seluruh teks: bahaya plastik dan perlunya mengurangi."},
{c:"Informatif · L3",t:"Paus biru adalah hewan terbesar di dunia. Ia hidup di laut dan bernapas dengan paru-paru, sehingga harus naik ke permukaan untuk mengambil udara.",q:"Pernyataan yang SESUAI teks adalah ...",o:["Paus biru bernapas dengan insang","Paus biru hewan terkecil","Paus biru bernapas dengan paru-paru","Paus biru hidup di sungai"],a:2,e:"Teks menyebut paus bernapas dengan paru-paru, jadi harus naik ke permukaan."},
{c:"Deskripsi · L1",t:"Bunga rafflesia tumbuh di hutan Sumatra. Bunganya sangat besar, berwarna merah bata dengan bintik putih, dan berbau busuk. Bunga ini tidak punya daun.",q:"Ciri bunga rafflesia adalah ...",o:["Kecil dan harum","Besar, merah bata, berbau busuk","Biru dan berdaun lebat","Tumbuh di laut"],a:1,e:"Ciri-ciri ditulis jelas di teks: besar, merah bata berbintik putih, berbau busuk."},
{c:"Deskripsi · L2 Ungkapan",t:"Dari puncak bukit, tampak hamparan permadani hijau di kaki gunung. Itulah kebun teh yang luas dan rapi.",q:"Makna hamparan permadani hijau adalah ...",o:["Karpet di rumah","Kebun teh hijau yang luas","Sungai yang dalam","Kain berwarna hijau"],a:1,e:"Itu kiasan: kebun teh luas diibaratkan permadani (karpet) hijau yang terbentang."},
{c:"Argumentasi · L2",t:"Sarapan penting bagi anak sekolah. Dengan sarapan, tubuh punya tenaga dan otak lebih mudah berkonsentrasi. Anak yang tidak sarapan sering lemas dan mengantuk di kelas.",q:"Gagasan pendukung pendapat bahwa sarapan itu penting adalah ...",o:["Sarapan harus mahal","Sarapan memberi tenaga dan membantu konsentrasi","Sarapan dilakukan malam hari","Sarapan hanya nasi"],a:1,e:"Gagasan pendukung berupa alasan: tenaga dan konsentrasi. Alasan itulah yang menguatkan pendapat."},
{c:"Denah · L1",t:MAP,q:"Perpustakaan berada di sebelah ... lapangan.",o:["Utara","Selatan","Barat","Timur"],a:2,e:"Lihat tanda U (utara) di atas. Perpustakaan ada di kiri lapangan, yaitu sebelah barat. Kantin di kanan (timur)."},
{c:"Denah · L3 Rute",t:MAP,q:"Rute tercepat dari gerbang menuju ruang kelas adalah ...",o:["Ke barat lewat perpustakaan","Ke timur lewat kantin","Lurus ke utara melewati lapangan","Ke selatan"],a:2,e:"Gerbang ada di bawah, ruang kelas di atas. Jalur lurus ke utara lewat lapangan paling singkat."},
{c:"Wawancara · L1",t:"<b>Rina:</b> Dokter, mengapa kita harus menyikat gigi?<br><b>Dokter Gigi:</b> Agar gigi bersih dan tidak berlubang. Sikatlah dua kali sehari, pagi dan sebelum tidur.<br><b>Rina:</b> Berapa kali sehari, Dok?<br><b>Dokter Gigi:</b> Dua kali ya, Rina.",q:"Kapan sebaiknya menyikat gigi menurut dokter?",o:["Hanya pagi hari","Pagi dan sebelum tidur","Setelah makan permen saja","Seminggu sekali"],a:1,e:"Jawaban tersurat di ucapan dokter: dua kali sehari, pagi dan sebelum tidur."},
{c:"Wawancara · L2 Ide Pokok",t:"<b>Doni:</b> Pak Tani, bagaimana cara merawat padi?<br><b>Pak Tani:</b> Padi perlu air cukup, dipupuk, dan dijaga dari hama burung.<br><b>Doni:</b> Apa susahnya, Pak?<br><b>Pak Tani:</b> Hama dan cuaca tak menentu, tetapi saya senang karena hasilnya dinikmati banyak orang.",q:"Ide pokok wawancara tersebut adalah ...",o:["Burung suka padi","Cara merawat padi dan tantangannya","Pak Tani suka hujan","Doni ingin jadi petani"],a:1,e:"Seluruh wawancara membahas cara merawat padi serta kesulitannya. Itulah gagasan utamanya."},
{c:"Narasi · L1",t:"Subuh itu Pak Joko pergi melaut dengan perahu kecil. Setelah berjam-jam, jalanya penuh ikan tongkol. Ia pulang dengan wajah gembira.",q:"Ikan apa yang ditangkap Pak Joko?",o:["Ikan lele","Ikan mas","Ikan tongkol","Ikan paus"],a:2,e:"Tersurat di teks: jalanya penuh ikan tongkol."},
{c:"Narasi · L1",t:"Lina menanam bunga matahari di halaman. Setiap pagi sebelum berangkat sekolah, ia menyiramnya. Dua bulan kemudian, bunganya mekar.",q:"Kapan Lina menyiram bunganya?",o:["Setiap sore","Setiap malam","Setiap pagi","Setiap siang"],a:2,e:"Teks menyebut: setiap pagi sebelum berangkat sekolah."},
{c:"Narasi · L2 Emosi",t:"Kucing kesayangan Nadia hilang sejak kemarin. Nadia duduk di teras, matanya berkaca-kaca, dan ia tidak mau makan.",q:"Perasaan Nadia adalah ...",o:["Gembira","Sedih","Marah","Bangga"],a:1,e:"Mata berkaca-kaca dan tidak mau makan menunjukkan Nadia sedih."},
{c:"Narasi · L2 Perubahan",t:"Dulu Rio sangat pemalu dan takut berbicara. Setelah ikut ekstrakurikuler drama, ia berani tampil di depan kelas.",q:"Perubahan sifat Rio adalah dari ... menjadi ...",o:["berani – pemalu","pemalu – berani","malas – rajin","marah – sabar"],a:1,e:"Awalnya pemalu, sesudah ikut drama menjadi berani."},
{c:"Narasi · L2 Masalah",t:"Pagi itu Tika sadar buku PR-nya tertinggal di rumah. Padahal Bu Guru akan memeriksanya. Tika gelisah dan bingung.",q:"Masalah yang dihadapi Tika adalah ...",o:["Bukunya hilang di jalan","Buku PR tertinggal padahal akan diperiksa","Ia terlambat","Ia tidak bisa mengerjakan PR"],a:1,e:"Masalahnya: buku PR tertinggal padahal akan diperiksa guru."},
{c:"Narasi · L2 Idiom",t:"Paman pulang dari Bali membawa buah tangan berupa kaos untuk keponakannya.",q:"Arti buah tangan adalah ...",o:["Buah di tangan","Oleh-oleh","Tangan terluka","Hadiah ulang tahun"],a:1,e:"Buah tangan = oleh-oleh dari bepergian."},
{c:"Narasi · L2 Idiom",t:"Dewi anak yang ringan tangan. Ia selalu membantu Ibu menyapu dan mencuci piring tanpa disuruh.",q:"Ringan tangan berarti ...",o:["Suka memukul","Suka menolong","Suka mencuri","Tangannya kecil"],a:1,e:"Ringan tangan = suka membantu. Contohnya Dewi membantu Ibu."},
{c:"Narasi · L2 Idiom",t:"Ayah membanting tulang setiap hari sebagai tukang ojek demi biaya sekolah anak-anaknya.",q:"Membanting tulang artinya ...",o:["Mematahkan tulang","Bekerja keras","Beristirahat","Bermain"],a:1,e:"Membanting tulang = bekerja sangat keras."},
{c:"Narasi · L2 Ide Pokok",t:"Hari Sabtu, kelas 4 kerja bakti. Ada yang menyapu, ada yang menyiram tanaman, dan ada yang mengelap jendela. Kelas pun bersih dan nyaman.",q:"Ide pokok cerita adalah ...",o:["Jendela kelas kotor","Kelas 4 kerja bakti membersihkan kelas","Hari Sabtu libur","Tanaman perlu air"],a:1,e:"Semua kalimat membahas kegiatan kerja bakti kelas 4."},
{c:"Narasi · L2 Sebab-Akibat",t:"Hujan deras turun semalaman. Selokan dipenuhi sampah sehingga air meluap. Pagi harinya jalan di depan rumah Beni tergenang.",q:"Penyebab jalan tergenang adalah ...",o:["Beni bermain air","Selokan penuh sampah dan hujan deras","Ada pipa bocor","Matahari terik"],a:1,e:"Hujan deras dan selokan tersumbat sampah membuat air meluap."},
{c:"Narasi · L2 Amanat",t:"Kancil membohongi petani dan mencuri mentimun berkali-kali. Akhirnya ia tertangkap dan tidak dipercaya lagi oleh siapa pun.",q:"Amanat cerita itu adalah ...",o:["Mentimun itu enak","Jangan berbohong dan mencuri","Petani itu galak","Kancil hewan cerdik"],a:1,e:"Kancil dihukum karena berbohong dan mencuri, jadi kita harus jujur."},
{c:"Narasi · L2 Gagasan Pendukung",t:"Gotong royong membuat pekerjaan cepat selesai. Warga memperbaiki jembatan bersama-bersama. Dalam sehari jembatan itu sudah bisa dilewati.",q:"Gagasan pendukung yang tepat adalah ...",o:["Jembatan itu panjang","Warga memperbaiki jembatan bersama dan selesai dalam sehari","Warga suka berlibur","Jembatan dibuat dari besi"],a:1,e:"Gagasan pendukung menjelaskan bukti dari ide pokok: kerja bersama membuat cepat selesai."},
{c:"Narasi · L3 Kesesuaian",t:"Sari bangun pukul 05.00, lalu salat dan membantu Ibu memasak. Pukul 06.30 ia berangkat sekolah berjalan kaki bersama Mira.",q:"Pernyataan yang SESUAI cerita adalah ...",o:["Sari naik angkot","Sari bangun pukul 06.30","Sari berangkat bersama Mira","Sari memasak sendirian"],a:2,e:"Sari berangkat berjalan kaki bersama Mira. Pilihan lain bertentangan dengan teks."},
{c:"Narasi · L3 Kesesuaian",t:"Hasan menemukan anak kecil menangis karena tersesat. Hasan menenangkannya, lalu mengantarnya ke pos satpam.",q:"Tindakan yang sesuai dengan sifat Hasan adalah ...",o:["Pergi meninggalkan anak itu","Menertawakan anak itu","Membantu anak itu menemukan orang tuanya","Mengajak anak itu bermain"],a:2,e:"Hasan peduli dan suka menolong, jadi ia membantu anak itu."},
{c:"Informatif · L1",t:"Lebah madu hidup berkelompok di dalam sarang. Seekor ratu bertugas bertelur, sedangkan lebah pekerja mengumpulkan nektar dari bunga.",q:"Tugas lebah pekerja adalah ...",o:["Bertelur","Mengumpulkan nektar","Menjaga ratu saja","Membuat bunga"],a:1,e:"Tersurat: lebah pekerja mengumpulkan nektar dari bunga."},
{c:"Informatif · L1",t:"Matahari adalah sumber cahaya dan panas bagi bumi. Tanpa matahari, tumbuhan tidak dapat membuat makanan dan makhluk hidup akan kedinginan.",q:"Sumber cahaya dan panas bagi bumi adalah ...",o:["Bulan","Bintang kecil","Matahari","Awan"],a:2,e:"Kalimat pertama menyebut matahari sebagai sumber cahaya dan panas."},
{c:"Informatif · L2 Ide Pokok",t:"Kelelawar bisa terbang pada malam hari tanpa menabrak. Ia mengeluarkan bunyi yang memantul dari benda di sekitarnya. Pantulan itu membantunya mengenali arah.",q:"Ide pokok teks adalah ...",o:["Kelelawar tidur siang hari","Cara kelelawar mengenali arah saat terbang malam","Kelelawar makan buah","Kelelawar tinggal di gua"],a:1,e:"Seluruh teks menjelaskan bagaimana kelelawar tidak menabrak: lewat bunyi pantul."},
{c:"Informatif · L2 Info Penting",t:"Air hujan meresap ke tanah dan disimpan oleh akar pohon. Hutan yang gundul tidak mampu menyimpan air sehingga mudah banjir.",q:"Simpulan teks yang tepat adalah ...",o:["Hutan perlu dijaga agar tidak banjir","Hujan itu berbahaya","Pohon tidak butuh air","Banjir terjadi karena tanah keras"],a:0,e:"Hutan menyimpan air; jika gundul, banjir mudah terjadi. Jadi hutan harus dijaga."},
{c:"Informatif · L3",t:"Komodo adalah kadal terbesar di dunia dan hanya hidup di beberapa pulau di Nusa Tenggara Timur. Komodo dilindungi oleh pemerintah.",q:"Pernyataan yang SESUAI teks adalah ...",o:["Komodo hidup di seluruh Indonesia","Komodo kadal terkecil","Komodo dilindungi pemerintah","Komodo hidup di Sumatra"],a:2,e:"Kalimat terakhir menyebut komodo dilindungi pemerintah."},
{c:"Deskripsi · L1",t:"Candi Borobudur terletak di Magelang, Jawa Tengah. Candi Buddha ini berbentuk bertingkat dengan banyak stupa dan relief di dindingnya.",q:"Candi Borobudur terletak di ...",o:["Yogyakarta","Magelang","Bali","Surabaya"],a:1,e:"Tersurat: terletak di Magelang, Jawa Tengah."},
{c:"Deskripsi · L1",t:"Rumah gadang adalah rumah adat Minangkabau. Atapnya melengkung runcing seperti tanduk kerbau dan dindingnya berukir indah.",q:"Atap rumah gadang berbentuk ...",o:["Datar","Bulat","Melengkung runcing","Kerucut tinggi"],a:2,e:"Atap rumah gadang melengkung runcing seperti tanduk kerbau."},
{c:"Deskripsi · L2",t:"Pantai itu berpasir putih halus. Airnya jernih sehingga ikan kecil terlihat berenang. Nyiur melambai dan angin bertiup sejuk.",q:"Simpulan deskripsi tersebut adalah pantai itu ...",o:["Kotor dan berbahaya","Indah dan nyaman","Sepi dan menakutkan","Berbatu dan gelap"],a:1,e:"Pasir putih, air jernih, dan angin sejuk menunjukkan pantai indah dan nyaman."},
{c:"Deskripsi · L2 Ungkapan",t:"Menjelang panen, sawah di desa itu bagai hamparan emas. Padi menguning sejauh mata memandang.",q:"Hamparan emas dalam teks berarti ...",o:["Perhiasan emas","Padi menguning yang luas","Tanah berpasir","Pasir pantai"],a:1,e:"Padi yang menguning diibaratkan emas karena warnanya kuning berkilau."},
{c:"Argumentasi · L1",t:"Menurut saya, kebersihan kelas harus dijaga bersama. Kelas bersih membuat belajar nyaman dan mencegah penyakit.",q:"Pendapat penulis adalah ...",o:["Kelas boleh kotor","Kebersihan kelas harus dijaga bersama","Belajar di rumah","Hanya guru yang membersihkan"],a:1,e:"Pendapat biasanya ditandai kata menurut saya. Isinya: kebersihan kelas dijaga bersama."},
{c:"Argumentasi · L1",t:"Kita sebaiknya membawa tas belanja sendiri. Dengan begitu, kita mengurangi sampah kantong plastik yang mencemari lingkungan.",q:"Alasan penulis menyarankan membawa tas belanja sendiri adalah ...",o:["Tas belanja murah","Mengurangi sampah plastik","Supaya terlihat keren","Agar belanja cepat"],a:1,e:"Alasan ada setelah kata dengan begitu: mengurangi sampah plastik."},
{c:"Argumentasi · L2",t:"Membaca buku setiap hari itu penting. Kita jadi punya banyak kosakata, pengetahuan bertambah, dan imajinasi berkembang.",q:"Gagasan pendukungnya adalah ...",o:["Buku itu berat","Kosakata, pengetahuan, dan imajinasi bertambah","Buku dijual di toko","Membaca itu lama"],a:1,e:"Gagasan pendukung berupa alasan yang menguatkan pendapat bahwa membaca penting."},
{c:"Argumentasi · L3",t:"Olahraga teratur baik untuk kesehatan. Namun, Dani tidak pernah berolahraga dan sering sakit.",q:"Contoh Dani mendukung pendapat bahwa ...",o:["Olahraga itu melelahkan","Olahraga teratur menjaga kesehatan","Sakit itu wajar","Dani sangat sibuk"],a:1,e:"Dani tidak berolahraga dan sering sakit. Itu menguatkan pendapat bahwa olahraga menjaga kesehatan."},
{c:"Argumentasi · L2",t:"Buang sampah pada tempatnya menjaga lingkungan tetap bersih. Lingkungan bersih membuat kita sehat. Sampah sembarangan menyumbat selokan.",q:"Simpulan paling tepat adalah ...",o:["Selokan harus besar","Membuang sampah pada tempatnya menjaga kebersihan dan kesehatan","Sampah bisa dibakar","Lingkungan itu luas"],a:1,e:"Simpulan merangkum isi teks: sampah pada tempatnya → bersih → sehat."},
{c:"Denah · L1",t:MAP,q:"Kantin berada di sebelah ... lapangan.",o:["Barat","Timur","Utara","Selatan"],a:1,e:"Kantin ada di kanan lapangan, yaitu sebelah timur."},
{c:"Denah · L2",t:MAP,q:"Ruang kelas berada di sebelah ... lapangan.",o:["Utara","Selatan","Timur","Barat"],a:0,e:"Ruang kelas di atas lapangan. Atas = utara (lihat tanda U)."},
{c:"Denah · L3 Rute",t:MAP,q:"Dari perpustakaan menuju kantin, rute yang benar adalah ...",o:["Ke utara lewat kelas","Ke timur melewati lapangan","Ke selatan lewat gerbang","Ke barat"],a:1,e:"Perpustakaan di barat, kantin di timur. Jalur terpendek ke timur lewat lapangan."},
{c:"Wawancara · L1",t:"<b>Wati:</b> Kak Ana, sejak kapan Kakak berlatih renang?<br><b>Ana (atlet):</b> Sejak usia delapan tahun. Saya berlatih empat kali seminggu.<br><b>Wati:</b> Apa kuncinya berhasil?<br><b>Ana:</b> Disiplin dan tidak mudah menyerah.",q:"Sejak usia berapa Ana berlatih renang?",o:["Enam tahun","Delapan tahun","Sepuluh tahun","Empat tahun"],a:1,e:"Ana menjawab: sejak usia delapan tahun."},
{c:"Wawancara · L2",t:"<b>Wati:</b> Apa kunci keberhasilan Kakak?<br><b>Ana:</b> Disiplin berlatih, makan sehat, dan tidak mudah menyerah walaupun pernah kalah.",q:"Ide pokok jawaban Ana adalah ...",o:["Ana pernah kalah","Kunci keberhasilan Ana","Ana suka makan","Ana atlet lari"],a:1,e:"Semua jawaban Ana menjelaskan kunci keberhasilannya."},
{c:"Wawancara · L1",t:"<b>Edo:</b> Dokter, bagaimana agar kita tidak mudah sakit?<br><b>Dokter:</b> Cuci tangan, makan sayur dan buah, serta tidur cukup.",q:"Menurut dokter, yang dilakukan agar tidak mudah sakit adalah ...",o:["Bermain sampai malam","Mencuci tangan","Tidak makan sayur","Mandi sekali sehari"],a:1,e:"Cuci tangan disebut dokter sebagai salah satu cara agar tidak mudah sakit."}
];

const T=[
{c:"TKA · Narasi L3",t:"Pak Danu pemilik warung kecil. Ketika harga beras naik, ia tidak menaikkan harga nasi bungkusnya, bahkan rela mengurangi keuntungan. “Yang penting pelanggan tidak kesusahan,” ujarnya. Suatu hari warungnya sepi karena restoran besar baru dibuka di dekatnya. Namun, para pelanggan lama tetap datang dan mengajak tetangga mereka.",q:"Mengapa pelanggan lama tetap datang ke warung Pak Danu?",o:["Harga makanan lebih murah daripada restoran","Warung Pak Danu lebih besar dari restoran","Mereka ingat kebaikan Pak Danu yang peduli pada pelanggan","Restoran baru itu belum buka"],a:2,e:"Hubungan sebab-akibat: Pak Danu pernah menahan harga demi pelanggan, sehingga mereka setia. Teks tidak menyebut harga lebih murah dari restoran (pilihan A jebakan)."},
{c:"TKA · Idiom L3",t:"Sejak menjadi ketua kelas, Aldi memerintah teman-temannya dengan kasar dan tidak mau mendengar usul siapa pun. Lama-lama teman menjauhinya. Bu Maya menasihati, “Pemimpin yang baik tidak berhati batu.”",q:"Makna berhati batu pada nasihat Bu Maya adalah ...",o:["Pemberani menghadapi masalah","Keras dan tidak peduli perasaan orang lain","Kuat menahan lelah","Pendiam dan tidak banyak bicara"],a:1,e:"Hati yang keras seperti batu = tidak peka. Sikap Aldi yang kasar dan tidak mau mendengar cocok dengan makna ini."},
{c:"TKA · Watak L3",t:"Di depan pintu toko, Bima menghitung uang kembalian dua kali. Lebih lima ribu rupiah. Tangannya sempat menggenggam uang itu erat-erat, lalu ia berbalik. “Maaf, Kak, kembaliannya kelebihan,” katanya dengan suara bergetar.",q:"Kesimpulan yang paling tepat tentang Bima adalah ...",o:["Bima jujur meskipun sempat merasa tegang","Bima jujur karena diawasi kasir","Bima ragu lalu memutuskan menyimpan uang itu","Bima takut dimarahi ibunya"],a:0,e:"Menggenggam erat dan suara bergetar menunjukkan ia tegang, tetapi ia tetap mengembalikan uang. Jadi jujur walau ada godaan."},
{c:"TKA · Amanat L3",t:"Tia sering menyontek. Saat ujian, kertas contekannya jatuh dan ia ketahuan. Bu Guru tidak membentak; beliau meminta Tia mengulang ujian sendirian. Tia malu, lalu belajar bersama temannya setiap sore. Nilainya naik, walaupun belum sempurna.",q:"Pesan yang paling sesuai dengan cerita adalah ...",o:["Menyontek boleh jika tidak ketahuan","Belajar sore hari paling baik","Guru harus selalu memarahi murid","Nilai hasil usaha jujur lebih berharga daripada nilai hasil curang"],a:3,e:"Tia memperbaiki diri lewat usaha sendiri dan nilainya naik. Pesannya tentang kejujuran dan usaha, bukan soal waktu belajar."},
{c:"TKA · Kesesuaian L3",t:"Kakek bercerita, “Dulu aku berjalan lima kilometer ke sekolah, melewati sawah, lalu menyeberangi sungai kecil lewat jembatan bambu. Sepatuku kutenteng agar tidak basah dan kotor. Aku lelah, tetapi senang karena bertemu sahabat-sahabatku.”",q:"Pernyataan yang TIDAK sesuai dengan cerita Kakek adalah ...",o:["Kakek berjalan kaki lima kilometer","Kakek menyeberangi sungai lewat jembatan bambu","Kakek memakai sepatu sepanjang perjalanan","Kakek senang bertemu sahabat di sekolah"],a:2,e:"Perhatikan kata TIDAK! Sepatu ditenteng, bukan dipakai. Tiga pilihan lain sesuai teks."},
{c:"TKA · Informatif L2",t:"Terumbu karang dibangun oleh hewan kecil bernama polip yang menghasilkan kerangka kapur. Terumbu menjadi rumah bagi banyak ikan dan melindungi pantai dari hantaman ombak. Namun, kenaikan suhu laut membuat karang memutih dan akhirnya mati.",q:"Simpulan yang tepat dari teks adalah ...",o:["Karang adalah tumbuhan laut yang berbunga","Karang bermanfaat, tetapi terancam oleh kenaikan suhu laut","Karang memutih karena dimakan ikan","Pantai rusak jika tidak ada ikan"],a:1,e:"Teks menyebut dua hal: manfaat karang dan ancaman suhu laut. Karang itu hewan (polip), bukan tumbuhan."},
{c:"TKA · Informatif L2",t:"Cabai terasa pedas karena zat capsaicin yang membuat saraf di lidah merasa panas. Capsaicin tidak larut dalam air, sehingga minum air kurang membantu. Susu lebih efektif karena mengandung lemak yang dapat melarutkan capsaicin.",q:"Mengapa minum air kurang efektif menghilangkan rasa pedas?",o:["Air terlalu dingin","Air mengandung lemak","Air membuat cabai makin banyak","Capsaicin tidak larut dalam air"],a:3,e:"Kalimat kedua memberi alasannya: capsaicin tidak larut dalam air. Lemak pada susu yang melarutkannya."},
{c:"TKA · Informatif L3",t:"Matahari memanaskan air laut hingga menguap. Uap naik, mendingin, dan membentuk awan. Dari awan, air turun sebagai hujan, mengalir ke sungai, lalu kembali ke laut.",q:"Jika matahari tidak bersinar selama berhari-hari, hal yang paling mungkin terjadi adalah ...",o:["Penguapan berkurang sehingga awan dan hujan ikut berkurang","Hujan makin deras","Sungai mengalir ke atas","Laut menjadi kering seketika"],a:0,e:"Matahari adalah awal siklus. Tanpa panas, penguapan berkurang, awan sedikit, hujan pun berkurang. Ini kesimpulan dari hubungan sebab-akibat."},
{c:"TKA · Deskripsi L2",t:"Menjelang fajar di Gunung Bromo, kabut tipis menyelimuti lautan pasir. Semburat jingga mulai tampak di ufuk timur. Para wisatawan menggigil di atas punggung kuda, tetapi mata mereka berbinar menatap matahari terbit.",q:"Simpulan yang tepat dari deskripsi tersebut adalah ...",o:["Bromo membahayakan wisatawan","Bromo hanya indah di siang hari","Bromo dingin saat fajar, tetapi pemandangannya memukau","Wisatawan kecewa karena kedinginan"],a:2,e:"Menggigil = dingin; mata berbinar = kagum. Kedua rincian itu menyimpulkan: dingin tetapi memukau."},
{c:"TKA · Deskripsi L2",t:"Batik tulis dibuat dengan canting, satu garis demi satu garis, dan dapat memakan waktu berminggu-minggu. Batik cap dibuat dengan stempel tembaga sehingga selesai dalam waktu singkat dan harganya lebih murah.",q:"Batik tulis lebih mahal daripada batik cap karena ...",o:["Dibuat dari kain sutra","Pengerjaannya manual dan memerlukan waktu lama","Memakai stempel tembaga","Warnanya lebih sedikit"],a:1,e:"Rincian teks: dicanting satu per satu dan berminggu-minggu. Stempel tembaga adalah ciri batik cap."},
{c:"TKA · Argumentasi L3",t:"Sebagian orang berpendapat anak tidak boleh membawa ponsel ke sekolah karena mengganggu konsentrasi. Namun, ponsel dapat membantu belajar, misalnya membuka kamus daring atas arahan guru. Karena itu, aturan penggunaan yang jelas lebih tepat daripada larangan total.",q:"Pernyataan yang SESUAI dengan pendapat penulis adalah ...",o:["Penulis melarang ponsel sepenuhnya","Penulis membolehkan ponsel dipakai kapan saja","Penulis menganggap ponsel tidak berguna","Penulis memilih ada aturan pemakaian yang jelas"],a:3,e:"Pendapat penulis ada di kalimat akhir (kata kunci: Karena itu): aturan jelas, bukan larangan total dan bukan kebebasan penuh."},
{c:"TKA · Argumentasi L2",t:"Sekolah sebaiknya menyediakan tempat sampah terpisah untuk sampah basah dan kering. Pemilahan memudahkan daur ulang, mengurangi sampah di tempat pembuangan akhir, dan mendidik anak peduli lingkungan.",q:"Hal berikut yang BUKAN gagasan pendukung pendapat penulis adalah ...",o:["Memudahkan daur ulang","Mengurangi sampah di tempat pembuangan akhir","Tempat sampah dicat dengan warna menarik","Mendidik anak peduli lingkungan"],a:2,e:"Gagasan pendukung harus berupa alasan yang ada di teks. Warna cat tidak disebut sebagai alasan."},
{c:"TKA · Denah L2",t:MAP,q:"Dito berdiri di lapangan menghadap ke kantin, lalu berbalik 180 derajat. Ia sekarang menghadap ke ...",o:["Perpustakaan","Kantin","Ruang kelas","Gerbang"],a:0,e:"Kantin ada di timur. Berbalik 180° berarti menghadap ke arah sebaliknya, yaitu barat, tempat perpustakaan."},
{c:"TKA · Denah L3",t:MAP,q:"Rani masuk lewat gerbang, berjalan lurus sampai lapangan, lalu belok kiri dan terus berjalan. Ia akan tiba di ...",o:["Ruang kelas","Kantin","Gerbang","Perpustakaan"],a:3,e:"Dari gerbang Rani menghadap utara. Belok kiri dari utara berarti ke barat, ke perpustakaan. Belok kanan ke kantin."},
{c:"TKA · Wawancara L2",t:"<b>Ika:</b> Bu Sari, sejak kapan berjualan jamu?<br><b>Bu Sari:</b> Dua puluh tahun lalu, meneruskan usaha ibu saya. Awalnya sepi, tetapi saya terus memperbaiki rasa jamunya. Sekarang ada sepuluh pelanggan tetap yang memesan lewat telepon.",q:"Sikap Bu Sari yang dapat disimpulkan dari wawancara adalah ...",o:["Mudah menyerah","Gigih dan mau memperbaiki diri","Malas karena hanya meneruskan usaha","Sombong karena punya pelanggan"],a:1,e:"Walaupun awalnya sepi, ia terus memperbaiki rasa sampai punya pelanggan tetap. Itu tanda gigih."},
{c:"TKA · Wawancara L2",t:"<b>Rudi:</b> Pak Hadi, bagaimana pekerjaan Bapak?<br><b>Pak Hadi:</b> Saya mulai pukul 04.00. Sampah pasar mencapai dua truk. Kalau warga memilah sampah, pekerjaan kami lebih ringan, dan sebagian sampah bisa menjadi kompos.",q:"Informasi yang benar berdasarkan wawancara adalah ...",o:["Memilah sampah meringankan pekerjaan dan bisa menghasilkan kompos","Pak Hadi mulai bekerja pukul 14.00","Sampah pasar mencapai sepuluh truk","Kompos berbahaya bagi warga"],a:0,e:"Pilihan lain bertentangan dengan teks: kerja mulai 04.00, sampah dua truk, dan kompos tidak disebut berbahaya."},
{c:"TKA · Narasi L1",t:"Rabu pagi, Kayla tiba di sekolah pukul 07.15, sepuluh menit setelah bel berbunyi. Gerbang sudah ditutup, sehingga ia harus mencatat namanya pada buku piket.",q:"Bel sekolah berbunyi pukul ...",o:["07.00","07.05","07.10","07.25"],a:1,e:"07.15 dikurangi sepuluh menit = 07.05. Soal tersurat tetap perlu dihitung teliti."},
{c:"TKA · Narasi L1",t:"Di kebun stroberi, anak-anak lebih dulu mendengar arahan petani. Setelah itu mereka memetik buah yang merah. Terakhir, hasil petikan ditimbang di pondok.",q:"Urutan kegiatan anak-anak yang benar adalah ...",o:["Arahan, memetik, menimbang","Memetik, arahan, menimbang","Menimbang, memetik, arahan","Arahan, menimbang, memetik"],a:0,e:"Kata penanda urutan: lebih dulu, setelah itu, terakhir."},
{c:"TKA · Idiom L2",t:"Ibu menolak bertamu ke rumah Bu Lurah dengan tangan kosong. “Tidak sopan datang tanpa buah tangan,” katanya. Maka Ibu membeli sekotak kue lapis.",q:"Makna buah tangan dalam teks adalah ...",o:["Buah yang dipetik dengan tangan","Tangan yang terluka","Bingkisan yang dibawa saat bertamu","Uang untuk Bu Lurah"],a:2,e:"Buah tangan = bingkisan atau oleh-oleh. Dalam teks berwujud kue lapis."},
{c:"TKA · Idiom L2",t:"Bayu juara olimpiade sains. Saat wartawan memujinya, ia menjawab, “Ini berkat bimbingan guru dan bantuan teman-teman.”",q:"Sikap Bayu paling tepat digambarkan dengan ungkapan ...",o:["Besar kepala","Rendah hati","Keras kepala","Lapang dada"],a:1,e:"Ia berprestasi tetapi tidak sombong. Lapang dada artinya sabar menerima, jadi kurang tepat."},
{c:"TKA · Idiom L2",t:"Sepeda baru Gita lecet karena tertabrak teman. Gita menarik napas panjang, lalu bertanya baik-baik apa yang terjadi.",q:"Ungkapan yang tepat untuk sikap Gita adalah ...",o:["Panas hati","Berkepala dingin","Tinggi hati","Berat tangan"],a:1,e:"Kepala dingin = tenang dan tidak cepat marah saat menghadapi masalah."},
{c:"TKA · Perubahan Watak L2",t:"Dulu Fajar sering mengejek Ujang karena logat daerahnya. Suatu hari Fajar tersesat di desa dan Ujanglah yang mengantarnya pulang. Fajar meminta maaf dan mulai belajar bahasa daerah Ujang.",q:"Perubahan sikap Fajar adalah dari ... menjadi ...",o:["pemalu, berani","malas, rajin","suka merendahkan, menghargai","pelit, dermawan"],a:2,e:"Mengejek adalah merendahkan. Meminta maaf dan belajar bahasa Ujang menunjukkan sikap menghargai."},
{c:"TKA · Masalah Tokoh L2",t:"Mira ingin sekali ikut lomba menyanyi. Namun, suaranya serak dan ibunya melarang karena ia demam. Pendaftaran ditutup besok pagi.",q:"Masalah yang dihadapi Mira adalah ...",o:["Ingin ikut lomba padahal sedang sakit dan dilarang","Tidak punya lagu","Ibunya menyuruh ia lomba","Lomba ditutup bulan depan"],a:0,e:"Keinginan (lomba) berbenturan dengan keadaan (sakit) dan larangan ibu."},
{c:"TKA · Ide Pokok L2",t:"Pagi itu pasar sangat ramai. Pedagang sayur berteriak menawarkan dagangan, ibu-ibu menawar dengan riang, dan anak-anak berlarian di antara lapak.",q:"Ide pokok paragraf tersebut adalah ...",o:["Pedagang sayur berteriak","Suasana pasar yang ramai di pagi hari","Anak-anak suka bermain","Ibu-ibu pandai menawar"],a:1,e:"Semua kalimat menjelaskan satu hal: ramainya pasar. Pilihan lain hanya sebagian detail."},
{c:"TKA · Gagasan Pendukung L2",t:"Ayah orang yang sangat disiplin. Ia bangun pukul 04.30, lari pagi, lalu berangkat kerja tepat waktu. Ayah juga gemar memancing di hari libur.",q:"Kalimat yang BUKAN gagasan pendukung ide pokok “Ayah disiplin” adalah ...",o:["Ayah bangun pukul 04.30","Ayah lari pagi","Ayah berangkat kerja tepat waktu","Ayah gemar memancing di hari libur"],a:3,e:"Hobi memancing tidak membuktikan kedisiplinan. Tiga lainnya menunjukkan kebiasaan teratur."},
{c:"TKA · Sebab-Akibat L2",t:"Karena lupa menutup keran, bak mandi meluap. Air membuat lantai licin sehingga adik terpeleset di depan kamar mandi.",q:"Urutan sebab-akibat yang benar adalah ...",o:["Adik terpeleset, bak meluap, lantai licin, lupa menutup keran","Lantai licin, lupa menutup keran, bak meluap, adik terpeleset","Bak meluap, adik terpeleset, lupa menutup keran, lantai licin","Lupa menutup keran, bak meluap, lantai licin, adik terpeleset"],a:3,e:"Rantai peristiwa: keran lupa ditutup → bak meluap → lantai licin → adik terpeleset."},
{c:"TKA · Amanat L2",t:"Dua petani menanam jagung. Pak Ali hanya menabur bibit lalu pergi. Pak Budi menyiangi rumput dan menyiram setiap hari. Saat panen, jagung Pak Budi lebat, sedangkan jagung Pak Ali kerdil.",q:"Amanat cerita tersebut adalah ...",o:["Bibit jagung harus mahal","Petani sebaiknya pergi setelah menabur","Hasil baik diperoleh dengan ketekunan merawat","Jagung tumbuh tanpa air"],a:2,e:"Perbedaan hasil disebabkan perbedaan perawatan, sehingga pesannya: tekun dan telaten."},
{c:"TKA · Kesesuaian L3",t:"Hari Selasa, Nia meminjam buku dongeng di perpustakaan. Buku itu harus dikembalikan dalam waktu seminggu. Nia mengembalikannya hari Senin berikutnya.",q:"Pernyataan yang SESUAI dengan teks adalah ...",o:["Nia terlambat mengembalikan buku","Nia mengembalikan buku sebelum batas waktu","Nia meminjam buku hari Senin","Nia mengembalikan buku hari Kamis"],a:1,e:"Batas kembali: Selasa berikutnya. Nia mengembalikan hari Senin, yaitu satu hari lebih awal."},
{c:"TKA · Kesesuaian L3",t:"Tara sangat menyayangi binatang. Sepulang sekolah ia melihat anak kucing kehujanan di depan pagar.",q:"Kelanjutan cerita yang paling sesuai dengan watak Tara adalah ...",o:["Tara membawa anak kucing masuk dan menghangatkannya","Tara masuk rumah tanpa menoleh","Tara mengusir anak kucing itu","Tara menertawakan anak kucing itu"],a:0,e:"Tindakan tokoh harus sesuai wataknya. Penyayang binatang pasti menolong."},
{c:"TKA · Kesimpulan L3",t:"Sinta menanam biji mangga di pot. Ia menyiramnya setiap hari selama bertahun-tahun. Ketika berbuah, ia membagikan mangganya kepada para tetangga.",q:"Judul yang paling sesuai untuk cerita tersebut adalah ...",o:["Mangga Milik Tetangga","Sinta Suka Makan Buah","Hujan di Kebun","Dari Sebiji Mangga untuk Berbagi"],a:3,e:"Judul harus mencakup isi keseluruhan: menanam, merawat, lalu berbagi."},
{c:"TKA · Emosi L3",t:"Umar menunggu pengumuman lomba. Jantungnya berdebar dan tangannya dingin. Saat namanya disebut juara, ia terdiam sejenak, lalu melompat dan memeluk temannya.",q:"Urutan perasaan Umar yang tepat adalah ...",o:["Marah, sedih, kecewa","Bosan, malas, gembira","Cemas, terkejut, gembira","Takut, kesal, bangga"],a:2,e:"Berdebar dan tangan dingin = cemas; terdiam = terkejut; melompat dan memeluk = gembira."},
{c:"TKA · Informatif L1",t:"Pada penguin kaisar, penguin jantan mengerami telur selama dua bulan tanpa makan. Sementara itu, penguin betina pergi ke laut untuk mencari makan.",q:"Yang mengerami telur penguin kaisar adalah penguin ...",o:["Betina","Jantan","Betina dan jantan bergantian","Anak penguin"],a:1,e:"Tersurat: penguin jantan yang mengerami, betina mencari makan."},
{c:"TKA · Informatif L2",t:"Cacing tanah membuat lubang-lubang kecil di dalam tanah sehingga udara dan air mudah masuk. Kotoran cacing juga mengandung zat hara bagi tanaman. Karena itu petani menyebut cacing tanah sahabat kebun.",q:"Ide pokok teks tersebut adalah ...",o:["Cacing tanah berwarna cokelat","Cacing tanah hidup di kebun","Cacing tanah menyuburkan tanah sehingga bermanfaat bagi petani","Petani suka memelihara hewan"],a:2,e:"Teks menyebut dua manfaat dan simpulan petani. Ide pokok merangkum semuanya."},
{c:"TKA · Informatif L2",t:"Kunang-kunang dapat menyala karena zat kimia dalam tubuhnya bereaksi dengan oksigen. Cahaya itu hampir tidak menghasilkan panas. Kunang-kunang menggunakannya untuk memanggil pasangan.",q:"Informasi penting yang BENAR dari teks adalah ...",o:["Cahaya kunang-kunang sangat panas","Kunang-kunang menyala untuk mencari makan","Kunang-kunang menyala karena sinar matahari","Cahaya kunang-kunang berasal dari reaksi zat kimia dan oksigen"],a:3,e:"Cahaya berasal dari reaksi zat kimia dengan oksigen dan hampir tanpa panas."},
{c:"TKA · Informatif L3",t:"Gigi susu mulai tanggal pada usia sekitar enam tahun dan digantikan gigi tetap. Orang dewasa memiliki 32 gigi tetap, sedangkan anak kecil memiliki 20 gigi susu.",q:"Pernyataan yang SESUAI dengan teks adalah ...",o:["Gigi tetap tumbuh kembali setelah tanggal","Orang dewasa memiliki 32 gigi tetap","Anak memiliki 32 gigi susu","Gigi susu tanggal pada usia dua tahun"],a:1,e:"Cocokkan angka: dewasa 32 gigi tetap, anak 20 gigi susu, tanggal sekitar usia enam tahun."},
{c:"TKA · Informatif L3",t:"Pekan ini Kelas 4A mengumpulkan 12 kg sampah plastik, Kelas 4B 9 kg, dan Kelas 4C 15 kg. Semua sampah akan disetor ke bank sampah.",q:"Selisih sampah antara kelas terbanyak dan tersedikit adalah ...",o:["3 kg","6 kg","9 kg","15 kg"],a:1,e:"Terbanyak 4C (15 kg), tersedikit 4B (9 kg). 15 − 9 = 6 kg."},
{c:"TKA · Informatif L3",t:"Daun tumbuhan hijau mengandung klorofil yang menangkap cahaya matahari untuk membuat makanan. Tumbuhan di tempat gelap menjadi pucat dan tumbuh lemah.",q:"Kesimpulan yang paling sesuai adalah ...",o:["Tumbuhan tidak memerlukan cahaya","Tumbuhan membutuhkan cahaya agar sehat dan tumbuh baik","Tumbuhan pucat lebih kuat","Klorofil hanya ada di akar"],a:1,e:"Tanpa cahaya, makanan tidak terbentuk sehingga tumbuhan pucat dan lemah."},
{c:"TKA · Deskripsi L1",t:"Danau Toba terbentuk dari letusan gunung api purba. Di tengahnya ada Pulau Samosir, pulau terbesar di dalam danau. Airnya jernih dan sejuk.",q:"Pulau yang terdapat di tengah Danau Toba adalah ...",o:["Pulau Nias","Pulau Bali","Pulau Samosir","Pulau Komodo"],a:2,e:"Tersurat pada kalimat kedua."},
{c:"TKA · Deskripsi L1",t:"Angklung adalah alat musik bambu dari Jawa Barat. Bunyinya dihasilkan dengan cara digoyangkan. Setiap angklung hanya menghasilkan satu nada.",q:"Cara membunyikan angklung adalah ...",o:["Dipukul","Ditiup","Dipetik","Digoyangkan"],a:3,e:"Tersurat: dibunyikan dengan digoyangkan."},
{c:"TKA · Deskripsi L2",t:"Di Pasar Terapung Banjarmasin, perahu-perahu berjejal bagai ikan teri di dalam jaring. Para pedagang saling berdekatan menawarkan buah dan sayur.",q:"Makna perahu berjejal bagai ikan teri adalah ...",o:["Perahu sangat padat dan rapat","Perahu berbentuk ikan","Perahu sedikit dan berjauhan","Perahu menangkap ikan teri"],a:0,e:"Ikan teri di jaring berdesakan. Perumpamaan itu berarti perahu sangat padat."},
{c:"TKA · Deskripsi L2",t:"Bambu tumbuh sangat cepat. Batangnya kuat dan berongga sehingga ringan. Bambu dimanfaatkan untuk membuat rumah, alat musik, hingga perabot.",q:"Simpulan yang tepat tentang bambu adalah ...",o:["Bambu hanya untuk alat musik","Bambu tumbuh lambat","Bambu serbaguna karena kuat, ringan, dan cepat tumbuh","Bambu mudah patah"],a:2,e:"Rincian ciri dan manfaat mengarah pada simpulan bambu serbaguna."},
{c:"TKA · Argumentasi L1",t:"(1) Sekolah kami memiliki 12 ruang kelas. (2) Menurut saya, perpustakaan harus buka setiap hari. (3) Perpustakaan berada di dekat lapangan. (4) Koleksi bukunya berjumlah 800 buah.",q:"Kalimat yang berisi pendapat penulis adalah kalimat nomor ...",o:["1","2","3","4"],a:1,e:"Pendapat ditandai kata menurut saya dan berupa pandangan, bukan fakta yang dapat dihitung."},
{c:"TKA · Argumentasi L2",t:"Kita sebaiknya mengurangi minuman manis. Gula berlebih dapat merusak gigi dan membuat berat badan naik. Air putih lebih menyehatkan.",q:"Gagasan pendukung pendapat penulis adalah ...",o:["Minuman manis berwarna-warni","Gula berlebih merusak gigi dan menaikkan berat badan","Air putih tidak berasa","Minuman manis dijual di kantin"],a:1,e:"Gagasan pendukung berupa alasan yang menguatkan pendapat."},
{c:"TKA · Argumentasi L3",t:"Anak sebaiknya tidur cukup setiap malam.",q:"Alasan yang PALING kuat mendukung pendapat tersebut adalah ...",o:["Kasur yang empuk itu nyaman","Tidur cukup membuat tubuh tumbuh dan otak segar saat belajar","Malam hari itu gelap","Teman-teman juga tidur"],a:1,e:"Alasan kuat berkaitan langsung dengan manfaat bagi kesehatan dan belajar."},
{c:"TKA · Argumentasi L3",t:"Menurut saya, kantin sekolah wajib menjual buah. Buah mengandung vitamin yang menjaga daya tahan tubuh. Anak yang gemar makan buah lebih jarang sakit.",q:"Simpulan yang paling sesuai adalah ...",o:["Kantin menjual banyak jajanan","Buah di kantin membantu anak lebih sehat","Anak tidak boleh jajan","Vitamin hanya ada pada permen"],a:1,e:"Simpulan merangkum pendapat dan alasan: buah → vitamin → daya tahan tubuh."},
{c:"TKA · Denah L1",t:MAP,q:"Tempat yang berada di antara gerbang dan ruang kelas adalah ...",o:["Kantin","Perpustakaan","Lapangan","Taman"],a:2,e:"Gerbang paling selatan, ruang kelas paling utara; lapangan berada di tengahnya."},
{c:"TKA · Denah L2",t:MAP,q:"Beni keluar dari ruang kelas, berjalan lurus ke selatan, melewati satu tempat, lalu tiba di gerbang. Tempat yang ia lewati adalah ...",o:["Perpustakaan","Kantin","Lapangan","Ruang kelas"],a:2,e:"Jalur lurus dari kelas ke gerbang melewati lapangan."},
{c:"TKA · Denah L3",t:MAP,q:"Ayu dari gerbang ke kantin, lalu dari kantin ke perpustakaan. Arah perjalanannya berturut-turut adalah ...",o:["Utara, barat, timur, timur","Selatan, timur, barat, barat","Utara, timur, barat, barat","Utara, timur, timur, barat"],a:2,e:"Gerbang → utara ke lapangan → timur ke kantin → barat melewati lapangan → barat ke perpustakaan."},
{c:"TKA · Wawancara L1",t:"<b>Tia:</b> Pak Anton, berapa kali sapi diperah?<br><b>Pak Anton:</b> Dua kali sehari, pagi dan sore. Setiap sapi menghasilkan sekitar 15 liter susu per hari.",q:"Sapi diperah ... dalam sehari.",o:["Satu kali","Dua kali","Tiga kali","Empat kali"],a:1,e:"Tersurat: dua kali sehari, pagi dan sore."},
{c:"TKA · Wawancara L2",t:"<b>Dani:</b> Kak Lala, apa tugas pustakawan?<br><b>Kak Lala:</b> Mengatur buku di rak, mencatat peminjaman, dan menata buku baru yang datang tiap bulan agar mudah ditemukan.",q:"Ide pokok wawancara tersebut adalah ...",o:["Buku baru datang tiap bulan","Tugas pustakawan mengelola buku di perpustakaan","Kak Lala suka membaca","Rak buku itu tinggi"],a:1,e:"Semua jawaban Kak Lala menjelaskan tugas pustakawan."},
{c:"TKA · Wawancara L2",t:"<b>Mei:</b> Pak Wawan, mengapa gajah diberi makan dua kali sehari?<br><b>Pak Wawan:</b> Gajah makan sampai 150 kg per hari. Jika hanya sekali, perutnya tidak cukup menampung dan ia mudah lemas.",q:"Simpulan yang tepat dari jawaban Pak Wawan adalah ...",o:["Gajah malas makan","Gajah hanya makan sekali","Gajah diberi makan dua kali agar kebutuhan makannya terpenuhi","Gajah tidak suka makan pagi"],a:2,e:"Kebutuhan makan banyak dibagi dua kali agar cukup dan gajah tidak lemas."}
];
let Q=Q1;let me={n:"",av:AVS[0]},L=[],i=0,sc=0,hp=3,st=0,res=[],AC;
const $=s=>document.querySelector(s),app=$("#app");
function snd(seq){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();seq.forEach(([f,d,t],k)=>{const o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=f;o.connect(g);g.connect(AC.destination);const s=AC.currentTime+t;g.gain.setValueAtTime(.15,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)})}catch(e){}}
const S={click:[[600,.1,0]],ok:[[523,.12,0],[659,.12,.12],[784,.2,.24]],no:[[300,.2,0],[200,.3,.2]],win:[[523,.15,0],[659,.15,.15],[784,.15,.3],[1047,.4,.45]]};
function confetti(){for(let k=0;k<45;k++){const d=document.createElement("div");d.className="cf";d.textContent=["🎉","⭐","🎊","✨"][k%4];d.style.left=Math.random()*100+"vw";d.style.animationDelay=Math.random()+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}}
function home(){Q=T;
 app.innerHTML=`<h1>🚀 Petualangan Raja Baca<br>Misi ASSIKS Kelas 4 🏝️</h1><div class="card"><h2>Pilih avatar</h2><div class="av">${AVS.map(a=>`<span class="${a==me.av?"s":""}" onclick="me.av='${a}';snd(S.click);home()">${a}</span>`).join("")}</div><h2>Namamu?</h2><input id="nm" maxlength="14" placeholder="Tulis namamu" value="${me.n}"></div><div class="card"><h2>Pilih misi</h2>${Array.from({length:Math.ceil(Q.length/STG)},(_,k)=>`<button class="btn" onclick="go(${k})">🗺️ Level ${k+1} (soal ${k*STG+1}–${Math.min(Q.length,(k+1)*STG)})</button>`).join("")}<button class="btn g" onclick="go(-1)">🏆 Mode Maraton (${Q.length} soal)</button><button class="btn c" onclick="keys(T)">📖 Lihat Semua Kunci Jawaban</button></div>`}
function go(k){Q=T;me.n=($("#nm").value||"").trim()||"Petualang";snd(S.click);L=k<0?Q.map((_,x)=>x):Array.from({length:STG},(_,x)=>k*STG+x).filter(x=>x<Q.length);i=0;sc=0;hp=3;st=0;res=[];show()}
function show(){const d=Q[L[i]];
 app.innerHTML=`<div class="bar"><span>${me.av} ${me.n}</span><span>${"❤️".repeat(hp)}${"🖤".repeat(3-hp)}</span><span>⭐ ${sc} 🔥${st}</span></div><div class="card"><span class="tag">${d.c}</span> <small>Soal ${i+1}/${L.length}</small><div class="txt">${d.t}</div><b>${d.q}</b>${d.o.map((o,k)=>`<button class="btn opt" onclick="pick(${k})">${"ABCD"[k]}. ${o}</button>`).join("")}</div>`}
function pick(k){const d=Q[L[i]],ok=k==d.a;res.push(ok);
 if(ok){st++;sc+=10+(st>1?(st-1)*5:0);snd(S.ok)}else{st=0;hp--;snd(S.no)}
 const last=i==L.length-1||hp==0;
 $("#pc").innerHTML=`<div style="font-size:3em">${ok?"🎉":"🤔"}</div><h2>${ok?"Benar! Hebat, "+me.n+"!":"Belum tepat, tidak apa-apa!"}</h2><p><b>Kunci: ${"ABCD"[d.a]}. ${d.o[d.a]}</b></p><p>${d.e}</p>${ok&&st>1?`<p>🔥 Streak ${st}! Bonus poin!</p>`:""}<button class="btn g c" onclick="nx()">${last?"Lihat Hasil":"Lanjut ➜"}</button>`;
 $("#pop").style.display="flex"}
function nx(){$("#pop").style.display="none";snd(S.click);if(i==L.length-1||hp==0)end();else{i++;show()}}
function end(){const n=res.filter(x=>x).length,p=n/L.length,win=hp>0&&p>=.6,bt=p>=.9?3:p>=.7?2:p>=.5?1:0;
 if(win){snd(S.win);confetti()}else snd(S.no);
 app.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:3em">${win?"🏝️":"🌧️"}</div><h2>${win?"Misi Berhasil!":"Ayo coba lagi!"}</h2><p>${me.av} ${me.n}: benar ${n} dari ${L.length}</p><div style="font-size:2.4em">${"⭐".repeat(bt)}${"☆".repeat(3-bt)}</div><p>Skor: <b>${sc}</b></p><button class="btn c" onclick="keys()">📖 Kunci Jawaban</button><button class="btn g c" onclick="home()">🏠 Menu Utama</button></div>`}
function keys(z){if(z)Q=z;snd(S.click);app.innerHTML=`<h1>📖 Kunci Jawaban</h1><div class="card">${Q.map((d,k)=>`<div class="rv"><b>${k+1}. [${d.c}]</b> ${d.q}<br>✅ <b>${"ABCD"[d.a]}. ${d.o[d.a]}</b><br>💡 ${d.e}</div>`).join("")}<button class="btn c" onclick="home()">🏠 Kembali</button></div>`}
home();
</script></body></html>
